name: generate-slides

"on":
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get poppler-utils for the preview
        run: sudo apt-get install -y poppler-utils

      - name: Compile the documents
        uses: xu-cheng/latex-action@v3
        with:
          # ./lib wins via TEXINPUTS; drop the TeX Live copies anyway
          pre_compile: "tlmgr remove --force tikzpingus fancyqr || true"
          root_file: |
            noanim_inplace-merge.tex
            inplace-merge.tex

      - name: Generate the preview
        run: pdftoppm -png -f 1 -l 1 ./noanim_inplace-merge.pdf preview

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f "noanim_inplace-merge.pdf" "inplace-merge.pdf" "preview-01.png"
          git commit -m "Newly compiled data"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
